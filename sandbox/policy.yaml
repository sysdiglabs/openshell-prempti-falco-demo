# OpenShell sandbox policy for Claude Code (validated against OpenShell 0.1.2).
# Differs from the community base policy: no `tls: terminate` (removed in 0.1.x,
# TLS termination is automatic), process identity left to the compute driver,
# and /opt readable for Prempti.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /opt, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  claude_code:
    name: claude-code
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: full }
      - { host: statsig.anthropic.com, port: 443 }
      - { host: sentry.io, port: 443 }
      - { host: platform.claude.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
